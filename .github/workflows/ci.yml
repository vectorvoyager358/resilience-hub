# CI: frontend Vitest + backend unittest on pushes and PRs (no live Gemini/Pinecone).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=optional --no-audit --no-fund

      - name: Ensure Rollup native bindings (Linux)
        run: npm install --no-audit --no-fund --save-dev @rollup/rollup-linux-x64-gnu

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Test
        run: npm run test:run

      - name: Build (sanity)
        run: npm run build

  backend:
    name: backend (unittest + offline eval)
    runs-on: ubuntu-latest
    env:
      # Ensure routing/auth tests never call live APIs (mocks only).
      GEMINI_API_KEY: ""
      PINECONE_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: pip audit (known vulnerabilities)
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: Backend unittest
        run: python -m unittest discover -s tests/backend -p 'test_*.py' -t .

      - name: Offline chat eval (golden routing)
        run: python scripts/run_chat_eval.py

