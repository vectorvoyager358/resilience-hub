# CI: frontend Vitest + backend unittest on pushes and PRs (no live Gemini/Pinecone).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --include=optional --no-audit --no-fund

      - name: Ensure Rollup native bindings (Linux)
        run: npm install --no-audit --no-fund --save-dev @rollup/rollup-linux-x64-gnu

      - name: Test
        run: npm run test:run

      - name: Build (sanity)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Backend unittest
        run: python -m unittest discover -s tests/backend -p 'test_*.py' -t .

      - name: Offline chat eval (routing)
        run: python scripts/run_chat_eval.py

